name: Build and Publish Docker Images

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for Multi-Platform Builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Lowercase Registry Owner
        id: meta
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER_LOWER}" >> "$GITHUB_OUTPUT"

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. FEM Tesseract Simulation Engine (Port 8000)
      - name: Build and Push FEM Tesseract Engine
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./tesseracts/fem_tesseract/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/tesseract_fem:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/tesseract_fem:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Geometry & Porosity Tesseract Engine (Port 8001)
      - name: Build and Push Geometry Tesseract Engine
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./tesseracts/geometry_tesseract/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/tesseract_geometry:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/tesseract_geometry:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
