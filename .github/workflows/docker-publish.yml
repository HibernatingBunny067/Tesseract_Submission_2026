name: Build and Publish Docker Images

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Downcase Repository Owner for Docker Tag Compliance
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. FEM Tesseract Simulation Engine (Port 8000)
      - name: Build and Push FEM Tesseract Engine
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./tesseracts/fem_tesseract/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/tesseract_fem:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/tesseract_fem:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Geometry & Porosity Tesseract Engine (Port 8001)
      - name: Build and Push Geometry Tesseract Engine
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./tesseracts/geometry_tesseract/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/tesseract_geometry:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/tesseract_geometry:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Streamlit Biomechanics Dashboard (Port 8501)
      - name: Build and Push Streamlit Dashboard Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/tesseract_dashboard:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/tesseract_dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
