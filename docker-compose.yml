services:
  fem_tesseract:
    build:
      context: .
      dockerfile: tesseracts/fem_tesseract/Dockerfile
    container_name: tesseract_fem_engine
    ports:
      - "8000:8000"
    environment:
      - JAX_FEM_LOG_LEVEL=ERROR
      - TESSERACT_OUTPUT_PATH=/tmp/tesseract_runs
    volumes:
      - ./src:/app/src
      - ./tesseracts:/app/tesseracts
    restart: unless-stopped

  geometry_tesseract:
    build:
      context: .
      dockerfile: tesseracts/geometry_tesseract/Dockerfile
    container_name: tesseract_geometry_engine
    ports:
      - "8001:8001"
    volumes:
      - ./src:/app/src
      - ./tesseracts:/app/tesseracts
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tesseract_biomechanics_dashboard
    ports:
      - "8501:8501"
    environment:
      - FEM_TESSERACT_URL=http://fem_tesseract:8000
      - GEOMETRY_TESSERACT_URL=http://geometry_tesseract:8001
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./app.py:/app/app.py
      - ./logs:/app/logs
    depends_on:
      - fem_tesseract
      - geometry_tesseract
    restart: unless-stopped
