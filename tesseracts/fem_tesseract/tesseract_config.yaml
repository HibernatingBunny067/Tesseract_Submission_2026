# Tesseract configuration file for FEM Biomechanical Engine
# Conforms to Pasteur Labs Tesseract specification
name: "fem_tesseract"
version: "1.0.0"
description: "Differentiable JAX-FEM Biomechanical continuum solver for patient-specific orthopaedic implants"

env:
  JAX_FEM_LOG_LEVEL: "ERROR"
  PYTHONPATH: "/tesseract"

build_config:
  base_image: "debian:bookworm-slim"
  python_version: "3.12"
  target_platform: "native"
  extra_packages:
    - libgl1
    - libglu1-mesa
    - libgomp1
    - libxrender1
    - libxcursor1
    - libxinerama1
    - libxft2
    - curl
    - git
  package_data:
    - ["../../src", "src"]